<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09061b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jack's Wave Dasher</title>
<style>
  :root{--ink:#09061b;--white:#fff;--cyan:#59f7ff;--pink:#ff4fce;--yellow:#fff36a;--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--app-w:100vw;--app-h:100vh}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);touch-action:none;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,sans-serif}
  canvas{position:fixed;left:0;top:0;width:var(--app-w);height:var(--app-h);display:block;background:linear-gradient(145deg,#09061b,#171052)}
  #hud{position:fixed;z-index:8;left:calc(14px + var(--safe-left));right:calc(14px + var(--safe-right));top:calc(12px + var(--safe-top));display:flex;justify-content:space-between;pointer-events:none;color:#fff;font-weight:950;text-shadow:0 3px 0 #000;opacity:0;transition:opacity .18s ease}.playing #hud{opacity:1}
  .hudPill{padding:6px 10px;border:2px solid rgba(255,255,255,.92);border-radius:999px;background:rgba(10,6,27,.5);box-shadow:0 3px 0 rgba(0,0,0,.7);font-size:clamp(12px,2.6vw,16px)}
  .arcade{position:fixed;z-index:30;left:calc(12px + var(--safe-left));bottom:calc(12px + var(--safe-bottom));display:inline-flex;align-items:center;min-height:46px;padding:8px 14px;border:3px solid #fff;border-radius:999px;background:#100a2d;color:#fff;text-decoration:none;font-size:13px;font-weight:950;box-shadow:0 5px 0 #000;touch-action:manipulation}
  #flightHint{position:fixed;z-index:9;left:50%;bottom:calc(18px + var(--safe-bottom));transform:translateX(-50%);padding:8px 13px;border:2px solid rgba(255,255,255,.8);border-radius:999px;background:rgba(9,6,27,.72);color:#fff;font-size:12px;font-weight:950;letter-spacing:.05em;pointer-events:none;opacity:0;transition:opacity .25s}.playing #flightHint.show{opacity:1}
  #overlay{position:fixed;z-index:20;left:0;top:0;width:var(--app-w);height:var(--app-h);display:grid;place-items:center;padding:calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));background:linear-gradient(rgba(7,3,24,.18),rgba(7,3,24,.62));overflow:auto}
  #overlay.hidden{display:none}
  .card{width:min(760px,100%);padding:clamp(22px,5vw,50px);border:5px solid #fff;border-radius:clamp(24px,5vw,42px);background:linear-gradient(145deg,rgba(22,12,77,.96),rgba(108,28,169,.94));box-shadow:0 12px 0 #000,0 0 55px rgba(89,247,255,.35);color:#fff;text-align:center}
  .kicker{display:inline-block;padding:7px 12px;border:2px solid #fff;border-radius:999px;background:#ff4fce;color:#fff36a;font-size:12px;font-weight:950;letter-spacing:.08em}
  h1{margin:15px 0 8px;font-size:clamp(46px,11vw,94px);line-height:.82;letter-spacing:-.07em;text-shadow:0 6px 0 #09061b}h1 em{font-style:normal;color:var(--cyan)}
  #tagline{margin:15px auto 20px;max-width:590px;font-size:clamp(15px,3.5vw,22px);line-height:1.25;font-weight:800}
  .rules{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.rule{padding:9px 12px;border:3px solid #0a061d;border-radius:15px;background:#fff;color:#0a061d;font-weight:950}.rule:first-child{background:var(--cyan)}.rule:last-child{background:var(--yellow)}
  #start{display:inline-flex;align-items:center;justify-content:center;min-width:min(360px,86vw);min-height:58px;padding:12px 24px;border:4px solid #0a061d;border-radius:999px;background:linear-gradient(#fff36a,#ffae35);color:#0a061d;-webkit-appearance:none;appearance:none;font:inherit;font-size:clamp(18px,4vw,27px);font-weight:1000;cursor:pointer;box-shadow:0 8px 0 #0a061d;touch-action:manipulation}
  #start:active{transform:translateY(5px);box-shadow:0 3px 0 #0a061d}
  @media(max-width:500px) and (orientation:portrait){#flightHint{bottom:calc(78px + var(--safe-bottom));font-size:11px}}
  @media(max-height:480px){.card{padding:14px 25px}h1{font-size:clamp(42px,9vw,68px);margin:9px 0 5px}.kicker{display:none}#tagline{margin:7px auto 10px}.rules{margin-bottom:10px}.rule{padding:6px 10px}#start{min-height:48px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Wave Dasher game"></canvas>
<div id="hud"><div class="hudPill">DISTANCE <span id="score">0</span></div><div class="hudPill">BEST <span id="best">0</span></div></div>
<div id="flightHint">HOLD ANYWHERE ↗ • LET GO ↘</div>
<a class="arcade" href="../../">← ARCADE</a>
<div id="overlay">
  <div class="card">
    <div class="kicker">ONE-BUTTON NEON FLIGHT</div>
    <h1 id="title">WAVE<br><em>DASHER</em></h1>
    <p id="tagline">Thread the crystal tunnel with perfect diagonal moves!</p>
    <div class="rules"><span class="rule">HOLD = ↗ UP</span><span class="rule">LET GO = ↘ DOWN</span></div>
    <button id="start" type="button">START DASHING</button>
  </div>
</div>
<script>
(()=>{
  'use strict';
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),startLink=document.getElementById('start'),title=document.getElementById('title'),tagline=document.getElementById('tagline'),scoreText=document.getElementById('score'),bestText=document.getElementById('best'),flightHint=document.getElementById('flightHint');
  function readBest(){try{const value=Number(localStorage.getItem('waveDasherBest'));return Number.isFinite(value)&&value>0?Math.floor(value):0}catch{return 0}}
  function saveBest(value){try{localStorage.setItem('waveDasherBest',String(value))}catch{}}
  let audio=null;function wakeAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const resumed=audio.resume?.();resumed?.catch?.(()=>{})}catch{audio=null}}function tone(frequency,duration=.08,type='square',volume=.035){if(!audio)return;try{const oscillator=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,now);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(now);oscillator.stop(now+duration)}catch{}}
  const state={mode:'ready',held:false,didHold:false,didRelease:false,manual:false,score:0,best:readBest(),distance:0,speed:280,launchDelay:0,viewW:1,viewH:1,seed:7391};
  const player={x:0,y:0,size:18,rotation:Math.PI/4};
  const tunnel=[],trail=[],particles=[];const SPACING=105;
  function random(){state.seed=(state.seed*1664525+1013904223)>>>0;return state.seed/4294967296}
  function gapForDistance(){return Math.max(160,Math.min(state.viewH*.7,310)-state.distance*.006)}
  function addTunnelPoint(x,index){const gap=gapForDistance(),previous=tunnel[tunnel.length-1],calm=index<12;if(!previous||calm){tunnel.push({x,center:state.viewH*.5,gap});return}const maxSwing=Math.min(state.viewH*.11,SPACING*.68),swing=(random()*2-1)*maxSwing,edge=gap*.5+44,center=Math.max(edge,Math.min(state.viewH-edge,previous.center+swing));tunnel.push({x,center,gap})}
  function resetTunnel(){tunnel.length=0;state.seed=7391;const count=Math.max(14,Math.ceil(state.viewW/SPACING)+5);for(let i=0,x=-SPACING;i<count;i++,x+=SPACING)addTunnelPoint(x,i)}
  function viewportSize(){const viewport=window.visualViewport,iw=Math.max(1,Math.round(innerWidth)),ih=Math.max(1,Math.round(innerHeight)),vw=Math.max(1,Math.round(viewport?.width||iw)),vh=Math.max(1,Math.round(viewport?.height||ih));return (iw>ih)!==(vw>vh)?{w:iw,h:ih}:{w:vw,h:vh}}
  function syncViewport(){const size=viewportSize(),w=size.w,h=size.h,dpr=Math.min(devicePixelRatio||1,2),oldW=state.viewW,oldH=Math.max(1,state.viewH),changed=w!==oldW||h!==state.viewH;if(!changed)return;const relativeY=player.y/oldH,orientationChanged=oldW>1&&(oldW>state.viewH)!==(w>h);state.viewW=w;state.viewH=h;document.documentElement.style.setProperty('--app-w',w+'px');document.documentElement.style.setProperty('--app-h',h+'px');canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);player.x=w*.22;if(state.mode==='ready')player.y=h*.5;else if(state.mode==='running')player.y=orientationChanged?h*.5:Math.max(0,Math.min(h,relativeY*h));if(orientationChanged){trail.length=0;particles.length=0}if(tunnel.length){resetTunnel();if(state.mode==='running'){const corridor=corridorAt(player.x),radius=player.size*.58+4;player.y=Math.max(corridor.top+radius,Math.min(corridor.bottom-radius,player.y))}}}
  function startGame(e){e?.preventDefault();resetInput();wakeAudio();tone(520,.1,'triangle',.045);state.mode='running';state.distance=0;state.score=0;state.speed=280;state.launchDelay=.28;state.held=false;state.didHold=false;state.didRelease=false;player.x=state.viewW*.22;player.y=state.viewH*.5;player.rotation=Math.PI/4;trail.length=0;particles.length=0;title.innerHTML='WAVE<br><em>DASHER</em>';tagline.textContent='Thread the crystal tunnel with perfect diagonal moves!';startLink.textContent='START DASHING';scoreText.textContent='0';bestText.textContent=String(state.best);resetTunnel();document.body.classList.add('playing');flightHint.classList.add('show');overlay.classList.add('hidden')}
  function burst(count=10){for(let i=0;i<count&&particles.length<120;i++){const angle=random()*Math.PI*2,speed=40+random()*120;particles.push({x:player.x,y:player.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:.48+random()*.24,size:2+random()*4,color:i%3===0?'#fff36a':i%3===1?'#59f7ff':'#ff4fce'})}}
  function setHeld(value){value=!!value;if(value===state.held)return;state.held=value;player.rotation=value?-Math.PI/4:Math.PI/4;if(state.mode==='running'){if(value)state.didHold=true;else if(state.didHold)state.didRelease=true;burst(10);tone(value?700:310,.055,'square',.022)}}
  function corridorAt(x){let a=tunnel[0],b=tunnel[1]||a;for(let i=1;i<tunnel.length;i++)if(tunnel[i].x>=x){a=tunnel[i-1];b=tunnel[i];break}const span=Math.max(1,b.x-a.x),t=Math.max(0,Math.min(1,(x-a.x)/span)),center=a.center+(b.center-a.center)*t,gap=a.gap+(b.gap-a.gap)*t;return{top:center-gap*.5,bottom:center+gap*.5}}
  function finishRun(){if(state.mode!=='running')return;burst(34);tone(110,.24,'sawtooth',.055);state.mode='dead';state.held=false;state.best=Math.max(state.best,state.score);saveBest(state.best);bestText.textContent=String(state.best);title.innerHTML='WAVE<br><em>WIPED OUT!</em>';tagline.textContent='Distance '+state.score+' — weave through the tunnel and beat your best!';startLink.textContent='DASH AGAIN';document.body.classList.remove('playing');flightHint.classList.remove('show');overlay.classList.remove('hidden')}
  function step(dt){if(state.mode!=='running')return;if(state.launchDelay>0){const activeDt=Math.max(0,dt-state.launchDelay);state.launchDelay=Math.max(0,state.launchDelay-dt);if(activeDt<=0)return;dt=activeDt}const travel=state.speed*dt;state.distance+=travel;player.y+=(state.held?-1:1)*travel;for(const point of tunnel)point.x-=travel;for(const point of trail){point.x-=travel;point.life-=dt}while(trail.length&&(trail[0].x<0||trail[0].life<=0))trail.shift();const lastTrail=trail[trail.length-1];if(!lastTrail||Math.hypot(player.x-lastTrail.x,player.y-lastTrail.y)>7)trail.push({x:player.x,y:player.y,life:1.15,color:state.held?'#59f7ff':'#fff36a'});while(trail.length>80)trail.shift();for(const p of particles){p.x+=p.vx*dt-travel;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt}for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0||particles[i].x<-30)particles.splice(i,1);while(tunnel.length&&tunnel[1]?.x<-SPACING)tunnel.shift();while(!tunnel.length||tunnel[tunnel.length-1].x<state.viewW+SPACING*2)addTunnelPoint((tunnel[tunnel.length-1]?.x||0)+SPACING,99);state.score=Math.floor(state.distance/12);state.speed=Math.min(420,280+state.score*.32);scoreText.textContent=String(state.score);if(state.didHold&&state.didRelease&&state.score>5)flightHint.classList.remove('show');const corridor=corridorAt(player.x),radius=player.size*.58;if(player.y-radius<corridor.top||player.y+radius>corridor.bottom)finishRun()}
  function drawTunnel(w,h){ctx.save();ctx.shadowBlur=24;ctx.shadowColor='#ff4fce';ctx.fillStyle='#2c0a54';ctx.strokeStyle='#ff4fce';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);for(const p of tunnel)ctx.lineTo(p.x,p.center-p.gap*.5);ctx.lineTo(w,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowColor='#59f7ff';ctx.fillStyle='#0a3766';ctx.strokeStyle='#59f7ff';ctx.beginPath();ctx.moveTo(0,h);for(const p of tunnel)ctx.lineTo(p.x,p.center+p.gap*.5);ctx.lineTo(w,h);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();for(let i=1;i<tunnel.length;i+=2){const p=tunnel[i],top=p.center-p.gap*.5,bottom=p.center+p.gap*.5,size=17;ctx.fillStyle=i%4===1?'#fff36a':'#59f7ff';ctx.beginPath();ctx.moveTo(p.x-size,top);ctx.lineTo(p.x,top+size*1.7);ctx.lineTo(p.x+size,top);ctx.fill();ctx.beginPath();ctx.moveTo(p.x-size,bottom);ctx.lineTo(p.x,bottom-size*1.7);ctx.lineTo(p.x+size,bottom);ctx.fill()}}
  function draw(){const w=state.viewW,h=state.viewH;ctx.clearRect(0,0,w,h);const glow=ctx.createLinearGradient(0,0,w,h);glow.addColorStop(0,'#0a0620');glow.addColorStop(.55,'#17105c');glow.addColorStop(1,'#40116d');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);for(let i=0;i<34;i++){const x=(i*137-state.distance*(.16+(i%5)*.025))%(w+80),y=(i*83)%h;ctx.fillStyle=i%4===0?'rgba(255,243,106,.55)':'rgba(89,247,255,.38)';ctx.fillRect((x+w+80)%(w+80),y,10+(i%3)*8,2)}ctx.strokeStyle='rgba(89,247,255,.16)';ctx.lineWidth=1;const grid=46,shift=-(state.distance%grid);for(let x=shift;x<w;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(tunnel.length)drawTunnel(w,h);if(trail.length>1){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#59f7ff';ctx.shadowBlur=18;ctx.lineWidth=9;ctx.strokeStyle='rgba(255,255,255,.24)';ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);for(const p of trail)ctx.lineTo(p.x,p.y);ctx.stroke();ctx.lineWidth=4;for(let i=1;i<trail.length;i++){ctx.globalAlpha=Math.max(.2,trail[i].life/1.15);ctx.strokeStyle=trail[i].color;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke()}ctx.globalAlpha=1;ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.72);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size)}ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.rotation);ctx.shadowColor='#59f7ff';ctx.shadowBlur=28;ctx.fillStyle='#fff36a';ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(player.size,0);ctx.lineTo(-player.size*.7,-player.size*.62);ctx.lineTo(-player.size*.35,0);ctx.lineTo(-player.size*.7,player.size*.62);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ff4fce';ctx.fillRect(-player.size*.75,-3,player.size*.52,6);ctx.restore()}
  let last=performance.now();function frame(now){const size=viewportSize();if(size.w!==state.viewW||size.h!==state.viewH)syncViewport();const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;if(!state.manual)step(dt);draw();requestAnimationFrame(frame)}
  const activePointers=new Set(),activeTouches=new Set();function holdStart(e){if(state.mode!=='running')return;e.preventDefault();activePointers.add(e.pointerId);if(e.currentTarget===canvas)canvas.setPointerCapture?.(e.pointerId);setHeld(true)}function holdEnd(e){if(e?.pointerId!==undefined&&!activePointers.has(e.pointerId))return;e?.preventDefault();if(e?.pointerId!==undefined)activePointers.delete(e.pointerId);else activePointers.clear();if(!activePointers.size&&!activeTouches.size)setHeld(false)}
  function resetInput(){activePointers.clear();activeTouches.clear();setHeld(false)}let resizeTimer=0;function scheduleViewport(){syncViewport();clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{resizeTimer=0;syncViewport()},180)}
  canvas.addEventListener('pointerdown',holdStart,{passive:false});canvas.addEventListener('pointerup',holdEnd,{passive:false});canvas.addEventListener('pointercancel',holdEnd,{passive:false});canvas.addEventListener('lostpointercapture',holdEnd,{passive:false});addEventListener('pointerup',holdEnd,{passive:false});addEventListener('pointercancel',holdEnd,{passive:false});if(!window.PointerEvent){const touchStart=e=>{if(state.mode!=='running')return;e.preventDefault();for(const touch of e.changedTouches||[])activeTouches.add(touch.identifier);setHeld(true)},touchEnd=e=>{let handled=false;for(const touch of e.changedTouches||[])handled=activeTouches.delete(touch.identifier)||handled;if(!handled)return;e.preventDefault();if(!activeTouches.size&&!activePointers.size)setHeld(false)};canvas.addEventListener('touchstart',touchStart,{passive:false});document.addEventListener('touchend',touchEnd,{passive:false});document.addEventListener('touchcancel',touchEnd,{passive:false});startLink.addEventListener('touchstart',e=>{startGame(e);touchStart(e)},{passive:false})}
  startLink.addEventListener('pointerdown',e=>{startGame(e);holdStart(e)},{passive:false});
  startLink.addEventListener('click',e=>{e.preventDefault();if(e.detail!==0)return;if(state.mode!=='running')startGame(e)});
  addEventListener('resize',scheduleViewport);addEventListener('orientationchange',()=>{resetInput();scheduleViewport()});addEventListener('blur',resetInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)resetInput();else scheduleViewport()});window.visualViewport?.addEventListener('resize',scheduleViewport);syncViewport();requestAnimationFrame(frame);
  bestText.textContent=String(state.best);
  window.__waveDasherTest={state,player,tunnel,trail,particles,start:startGame,setHeld,step,finish:finishRun,corridorAt,setManual:value=>{state.manual=!!value}};
})();
</script>
</body>
</html>
